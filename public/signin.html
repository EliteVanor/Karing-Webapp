<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập | Karing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&family=Raleway:wght@300;800&display=swap"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/auth.css">
    <script type="module" src="js/layout.js"></script>
    <script type="module" src="js/pages/signin.js"></script>
</head>

<body>
    <header>
        <div class="wrapper">
            <nav id="site-nav"></nav>
        </div>
    </header>

    <main class="wrapper auth-page">
        <h1>Đăng nhập</h1>
        <form id="signin-form" class="auth-card" hidden>
            <label>Email
                <input type="email" name="email" autocomplete="email" required>
            </label>
            <label>Mật khẩu
                <input type="password" name="password" autocomplete="current-password" minlength="6" required>
            </label>
            <p id="form-message" class="form-message" role="status" aria-live="polite"></p>
            <button type="submit" class="btn dark">Đăng nhập</button>
            <p>Chưa có tài khoản? <a href="signup.html">Đăng ký</a></p>
        </form>
        <div id="signed-in" class="auth-card" hidden>
            <p id="greeting"></p>
            <button type="button" id="sign-out" class="btn dark">Đăng xuất</button>
        </div>
    </main>

    <footer id="site-footer"></footer>
</body>
</html>

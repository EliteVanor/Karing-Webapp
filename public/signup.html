<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký | Karing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&family=Raleway:wght@300;800&display=swap"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/auth.css">
    <script type="module" src="js/layout.js"></script>
    <script type="module" src="js/pages/signup.js"></script>
</head>

<body>
    <header>
        <div class="wrapper">
            <nav id="site-nav"></nav>
        </div>
    </header>

    <main class="wrapper auth-page">
        <h1>Đăng ký</h1>
        <form id="signup-form" class="auth-card">
            <label>Email
                <input type="email" name="email" autocomplete="email" required>
            </label>
            <label>Mật khẩu
                <input type="password" name="password" autocomplete="new-password" minlength="6" required>
            </label>
            <p id="form-message" class="form-message" role="status" aria-live="polite"></p>
            <button type="submit" class="btn dark">Đăng ký</button>
            <p>Đã có tài khoản? <a href="signin.html">Đăng nhập</a></p>
        </form>
        <div id="signup-done" class="auth-card" hidden>
            <p>Bạn đã đăng ký thành công.</p>
            <a href="index.html">Quay về trang chủ</a>
        </div>
    </main>

    <footer id="site-footer"></footer>
</body>
</html>
